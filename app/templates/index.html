<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask MVC Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
    input { padding: .65rem; width: 70%; } button { padding: .7rem 1rem; cursor: pointer; }
    li { margin: .8rem 0; } small { color: #666; }
  </style>
</head>
<body>
  <h1>Flask MVC Notes</h1>
  <p>Flask + MySQL + Docker Compose</p>
  <form action="{{ url_for('home.create_note') }}" method="post">
    <input name="title" maxlength="120" placeholder="Write a note..." required>
    <button type="submit">Save</button>
  </form>
  <h2>Saved notes</h2>
  {% if notes %}
    <ul>
      {% for note in notes %}
        <li><strong>{{ note.title }}</strong><br><small>{{ note.created_at }}</small></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No notes yet. Add your first note above.</p>
  {% endif %}
</body>
</html>
